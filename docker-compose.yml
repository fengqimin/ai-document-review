# Local one-container deployment. The only external dependency is an
# OpenAI-compatible LLM endpoint, configured via .env (see .env.example).

services:
  app:
    build: .
    image: ai-doc-review:local
    container_name: ai-doc-review
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Must point at the mounted volume. A relative DATA_DIR from .env would
      # resolve against the container CWD (/app/app/api) and silently write
      # state inside the container layer, losing it on recreation.
      DATA_DIR: /app/data
    volumes:
      # All state: review.db (SQLite), documents/ (PDFs), logs/
      - ./data:/app/data
    restart: unless-stopped
