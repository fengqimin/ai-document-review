version: "3"

dotenv: [".env"]

output: "prefixed"

tasks:
  check:
    desc: Check local toolchain (uv, node, git, docker).
    silent: true
    cmds:
      - |
        for tool in uv node git; do
          if ! command -v "$tool" > /dev/null; then
            echo "ERROR: $tool is not installed. Install uv: https://docs.astral.sh/uv/"
            exit 1
          fi
        done
        echo "uv $(uv --version | cut -d' ' -f2) | node $(node -v)"
        if command -v docker > /dev/null; then
          echo "docker $(docker --version | cut -d' ' -f3 | tr -d ',')"
        else
          echo "docker not found (only needed for 'task up' / 'task docker-build')"
        fi

  # ------------------------------------------------------------------ install
  install:
    desc: Sync the Python 3.14 environment (uv) and install frontend deps.
    cmds:
      - uv sync
      - task: ui-install

  api-install:
    desc: Sync Python dependencies only (uv, Python 3.14).
    cmds:
      - uv sync

  ui-install:
    desc: Install frontend dependencies.
    dir: app/ui
    cmds:
      - npm install --no-audit --no-fund

  # ------------------------------------------------------------------ dev
  dev-api:
    desc: Run the FastAPI backend (http://localhost:8000, auto-reload).
    dir: app/api
    cmds:
      - uv run --project ../.. uvicorn main:app --reload --port 8000

  dev-ui:
    desc: Run the vite dev server (http://localhost:5173, proxies /api).
    dir: app/ui
    cmds:
      - npm run dev

  dev:
    desc: Run backend + frontend dev servers concurrently.
    deps: [dev-api, dev-ui]

  # ------------------------------------------------------------------ build / test
  ui-build:
    desc: Build the UI into app/api/www (served by the API).
    dir: app/ui
    cmds:
      - npm run build

  test:
    desc: Run backend and pipeline tests (pytest, via uv).
    cmds:
      - uv run pytest -q

  check-code:
    desc: Compile-check all Python sources on 3.14.
    cmds:
      - uv run python -m compileall -q app/api common flows/ai_doc_review
      - echo "COMPILE OK"

  lock:
    desc: Refresh uv.lock after editing pyproject.toml, then re-export requirements.txt.
    cmds:
      - uv lock
      - uv export --format requirements-txt --no-hashes --no-emit-project --no-dev --output-file requirements.txt

  # ------------------------------------------------------------------ docker
  docker-build:
    desc: Build the single-container image (Python 3.14 + uv lockfile).
    cmds:
      - docker build -t ai-doc-review:local .

  up:
    desc: Start the app container (needs .env, see .env.example). Data lives in ./data.
    cmds:
      - docker compose up -d --build
      - echo "UI + API on http://localhost:8000 (health: /api/health)"

  down:
    desc: Stop the app container (data in ./data is kept).
    cmds:
      - docker compose down

  logs:
    desc: Tail container logs.
    cmds:
      - docker compose logs -f app
