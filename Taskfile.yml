version: "3"

dotenv: [".env"]

output: "prefixed"

tasks:
  check:
    desc: Check local toolchain (node, python, docker).
    silent: true
    cmds:
      - |
        for tool in node python3 git; do
          if ! command -v "$tool" > /dev/null; then
            echo "ERROR: $tool is not installed."
            exit 1
          fi
        done
        echo "node $(node -v) | $(python3 --version)"
        if command -v docker > /dev/null; then
          echo "docker $(docker --version | cut -d' ' -f3 | tr -d ',')"
        else
          echo "docker not found (only needed for 'task up' / 'task docker-build')"
        fi

  # ------------------------------------------------------------------ install
  ui-install:
    desc: Install frontend dependencies.
    dir: app/ui
    cmds:
      - npm install --no-audit --no-fund

  api-install:
    desc: Create/refresh a local venv and install backend + pipeline deps.
    cmds:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --quiet -r requirements.txt
      - .venv/bin/python -m pip install --quiet pytest

  install: ui-install api-install

  # ------------------------------------------------------------------ dev
  dev-api:
    desc: Run the FastAPI backend (http://localhost:8000, auto-reload).
    dir: app/api
    cmds:
      - ../../.venv/bin/python -m uvicorn main:app --reload --port 8000

  dev-ui:
    desc: Run the vite dev server (http://localhost:5173, proxies /api).
    dir: app/ui
    cmds:
      - npm run dev

  dev:
    desc: Run backend + frontend dev servers concurrently.
    deps: [dev-api, dev-ui]

  # ------------------------------------------------------------------ build / test
  ui-build:
    desc: Build the UI into app/api/www (served by the API).
    dir: app/ui
    cmds:
      - npm run build

  test:
    desc: Run backend and pipeline tests (pytest).
    cmds:
      - .venv/bin/python -m pytest flows/ai_doc_review/tests app/api/tests -q

  check-code:
    desc: Compile-check all Python sources.
    cmds:
      - .venv/bin/python -m compileall -q app/api common flows/ai_doc_review
      - echo "COMPILE OK"

  # ------------------------------------------------------------------ docker
  docker-build:
    desc: Build the single-container image.
    cmds:
      - docker build -t ai-doc-review:local .

  up:
    desc: Start the app container (needs .env, see .env.example). Data lives in ./data.
    cmds:
      - docker compose up -d --build
      - echo "UI + API on http://localhost:8000 (health: /api/health)"

  down:
    desc: Stop the app container (data in ./data is kept).
    cmds:
      - docker compose down

  logs:
    desc: Tail container logs.
    cmds:
      - docker compose logs -f app
